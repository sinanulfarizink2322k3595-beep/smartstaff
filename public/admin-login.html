<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartStaff – Admin Access</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0c29;
      --bg2: #1a1740;
      --accent: #7c3aed;
      --accent-light: #a78bfa;
      --accent-dark: #5b21b6;
      --gold: #f59e0b;
      --gold-light: #fef3c7;
      --white: #ffffff;
      --muted: rgba(255,255,255,0.55);
      --border: rgba(255,255,255,0.12);
      --input-bg: rgba(255,255,255,0.07);
      --input-border: rgba(255,255,255,0.18);
      --danger: #ef4444;
      --success: #10b981;
      --radius: 12px;
      --shadow: 0 25px 60px rgba(0,0,0,0.5);
    }

    body {
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* Animated gradient background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      pointer-events: none;
      animation: float 12s ease-in-out infinite alternate;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #7c3aed, #2563eb);
      top: -120px; left: -120px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #f59e0b, #ef4444);
      bottom: -100px; right: -100px;
      animation-delay: -6s;
    }
    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.08); }
    }

    .admin-card {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
      z-index: 1;
      animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Top strip */
    .card-top {
      background: linear-gradient(135deg, var(--accent-dark), var(--accent), #2563eb);
      padding: 2.25rem 2rem 1.75rem;
      text-align: center;
      position: relative;
    }
    .card-top::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 40px;
      background: rgba(255,255,255,0.06);
      clip-path: ellipse(55% 100% at 50% 100%);
    }

    .shield-icon {
      width: 70px; height: 70px;
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1rem;
      box-shadow: 0 0 30px rgba(124,58,237,0.5);
    }

    .card-top h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--white);
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
    }

    .restricted-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: rgba(245,158,11,0.2);
      border: 1px solid rgba(245,158,11,0.4);
      color: var(--gold);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-top: 0.4rem;
    }

    .card-body {
      padding: 2rem;
    }

    .form-group { margin-bottom: 1.25rem; }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.5rem;
    }

    .input-wrap { position: relative; }
    .input-icon {
      position: absolute;
      left: 1rem; top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      pointer-events: none;
      opacity: 0.6;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem 0.75rem 2.75rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: var(--radius);
      color: var(--white);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.3); }
    .form-control:focus {
      border-color: var(--accent-light);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.25);
      background: rgba(255,255,255,0.1);
    }

    .btn-login {
      width: 100%;
      padding: 0.85rem 1rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      border: none;
      border-radius: var(--radius);
      color: var(--white);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: all 0.25s;
      box-shadow: 0 4px 20px rgba(124,58,237,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(124,58,237,0.55);
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
    }
    .btn-login:active { transform: translateY(0); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .alert-danger {
      background: rgba(239,68,68,0.15);
      border: 1px solid rgba(239,68,68,0.35);
      color: #fca5a5;
    }
    .alert-success {
      background: rgba(16,185,129,0.15);
      border: 1px solid rgba(16,185,129,0.35);
      color: #6ee7b7;
    }

    .card-footer {
      padding: 1rem 2rem 1.5rem;
      text-align: center;
    }
    .back-link {
      color: var(--muted);
      font-size: 0.82rem;
      text-decoration: none;
      transition: color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .back-link:hover { color: var(--white); text-decoration: none; }

    /* Spinner inside button */
    .btn-spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="admin-card">
    <div class="card-top">
      <div class="shield-icon">🛡️</div>
      <h1>Admin Portal</h1>
      <p style="color:rgba(255,255,255,0.7); font-size:0.85rem; margin-top:0.25rem;">SmartStaff Administration</p>
      <div class="restricted-badge">⚠️ Restricted Access</div>
    </div>

    <div class="card-body">
      <div id="alert-box"></div>

      <form id="admin-login-form" novalidate>
        <div class="form-group">
          <label class="form-label">Administrator Email</label>
          <div class="input-wrap">
            <span class="input-icon">✉️</span>
            <input type="email" id="admin-email" class="form-control"
              placeholder="admin@smartstaff.com" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrap">
            <span class="input-icon">🔑</span>
            <input type="password" id="admin-password" class="form-control"
              placeholder="Enter admin password" required autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="btn-login" id="submit-btn">
          <span id="btn-text">🚀 Sign In to Admin Panel</span>
          <span class="btn-spinner" id="btn-spinner"></span>
        </button>
      </form>
    </div>

    <div class="card-footer">
      <a href="index.html" class="back-link">← Back to main portal</a>
    </div>
  </div>

  <script>
    // Redirect if already logged in as admin
    try {
      const tok = localStorage.getItem('token');
      const usr = JSON.parse(localStorage.getItem('user') || 'null');
      if (tok && usr && usr.role === 'admin') {
        window.location.href = 'admin.html';
      }
    } catch(e) {}

    function showAlert(msg, type = 'danger') {
      const box = document.getElementById('alert-box');
      const icon = type === 'danger' ? '⚠️' : '✅';
      box.innerHTML = `<div class="alert alert-${type}">${icon} ${msg}</div>`;
      setTimeout(() => box.innerHTML = '', 6000);
    }

    document.getElementById('admin-login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const email    = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const btn      = document.getElementById('submit-btn');
      const txt      = document.getElementById('btn-text');
      const spinner  = document.getElementById('btn-spinner');

      if (!email || !password) { showAlert('Please enter your email and password.'); return; }

      btn.disabled = true;
      txt.style.display = 'none';
      spinner.style.display = 'block';

      try {
        const res  = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'Login failed. Please check your credentials.');
          return;
        }
        if (data.user.role !== 'admin') {
          showAlert('Access denied. This portal is for administrators only.');
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = 'admin.html';
      } catch (err) {
        showAlert('Connection error. Please try again.');
      } finally {
        btn.disabled = false;
        txt.style.display = 'inline';
        spinner.style.display = 'none';
      }
    });
  </script>
</body>
</html>
